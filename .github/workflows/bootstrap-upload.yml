name: Finish FinLens source upload

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore FinLens project files
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part*.b64 | base64 --decode > /tmp/finlens.tgz
          tar -xzf /tmp/finlens.tgz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-upload.yml

      - name: Commit complete project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No project changes to commit."
            exit 0
          fi
          git commit -m "Upload GitHub-ready FinLens web app"
          git push origin HEAD:main
